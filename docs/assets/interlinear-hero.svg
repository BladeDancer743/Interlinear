<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Interlinear — read technical papers without leaving the sentence</title>
  <desc id="desc">A dark editorial banner showing English paper text connected to concise Chinese interlinear annotations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset="0.55" stop-color="#0b1b2a"/>
      <stop offset="1" stop-color="#10283a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#35d7b5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#35d7b5" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .sans { font-family: "Segoe UI", Inter, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .cn { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="480" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="478" rx="27" fill="none" stroke="#2b4558"/>
  <rect width="1200" height="480" rx="28" fill="url(#glow)"/>

  <g opacity="0.18" stroke="#507087">
    <path d="M0 92H1200M0 386H1200"/>
    <path d="M702 0V480"/>
  </g>
  <circle cx="1000" cy="103" r="116" fill="#28d6b0" opacity="0.055" filter="url(#soft)"/>

  <g transform="translate(64 58)">
    <rect width="238" height="30" rx="15" fill="#122d3d" stroke="#285369"/>
    <circle cx="18" cy="15" r="4" fill="#4de1c1"/>
    <text x="32" y="20" class="mono" font-size="12" letter-spacing="1.7" fill="#9db9c8">AGENT SKILL · PAPER READING</text>

    <text x="0" y="117" class="sans" font-size="66" font-weight="760" letter-spacing="3" fill="#f4f8fb">INTERLINEAR</text>
    <rect x="0" y="139" width="96" height="4" rx="2" fill="#4de1c1"/>
    <text x="0" y="184" class="sans" font-size="23" font-weight="600" fill="#dbe8ee">Stay inside the sentence.</text>
    <text x="0" y="216" class="sans" font-size="23" font-weight="600" fill="#dbe8ee">See through the terminology.</text>
    <text x="0" y="263" class="cn" font-size="17" fill="#8fabb9">英文原文 · 中文夹注 · 语境解释</text>

    <g transform="translate(0 306)">
      <rect width="142" height="42" rx="10" fill="#0e2635" stroke="#24495c"/>
      <text x="18" y="27" class="mono" font-size="13" fill="#a7c0cc">3 reader levels</text>
      <rect x="154" width="162" height="42" rx="10" fill="#0e2635" stroke="#24495c"/>
      <text x="172" y="27" class="mono" font-size="13" fill="#a7c0cc">2 explanation modes</text>
      <rect x="328" width="155" height="42" rx="10" fill="#0e2635" stroke="#24495c"/>
      <text x="346" y="27" class="mono" font-size="13" fill="#a7c0cc">64 term families</text>
    </g>
  </g>

  <g transform="translate(744 70)">
    <rect width="392" height="338" rx="20" fill="#091722" stroke="#2b5063"/>
    <rect x="22" y="22" width="348" height="294" rx="13" fill="#0c1d29" stroke="#183747"/>
    <circle cx="43" cy="43" r="4" fill="#4de1c1"/>
    <circle cx="57" cy="43" r="4" fill="#f1c27d" opacity="0.8"/>
    <circle cx="71" cy="43" r="4" fill="#517287"/>
    <text x="294" y="47" class="mono" font-size="10" fill="#638497">§ 2.1</text>

    <text x="42" y="92" class="mono" font-size="13" fill="#b8cbd5">unless quantum error correction</text>
    <rect x="42" y="105" width="269" height="2" rx="1" fill="#4de1c1"/>
    <path d="M311 106 C345 106 345 132 331 144" fill="none" stroke="#4de1c1" stroke-width="2"/>
    <circle cx="331" cy="144" r="4" fill="#4de1c1"/>

    <rect x="42" y="129" width="289" height="72" rx="12" fill="#112c39" stroke="#2d655f"/>
    <text x="58" y="157" class="cn" font-size="14" font-weight="700" fill="#62e5c8">【量子纠错】</text>
    <text x="58" y="181" class="cn" font-size="13" fill="#c7d8df">把逻辑信息编码进更大的系统，</text>
    <text x="58" y="199" class="cn" font-size="13" fill="#c7d8df">通过综合征检测并修正错误。</text>

    <text x="42" y="238" class="mono" font-size="13" fill="#7895a5">is used, the circuit depth</text>
    <text x="42" y="264" class="mono" font-size="13" fill="#7895a5">remains limited by noise.</text>

    <rect x="42" y="286" width="97" height="20" rx="10" fill="#2f281c"/>
    <text x="55" y="300" class="mono" font-size="10" fill="#f1c27d">intermediate</text>
    <rect x="148" y="286" width="82" height="20" rx="10" fill="#123128"/>
    <text x="162" y="300" class="mono" font-size="10" fill="#69ddbe">verified</text>
  </g>

  <text x="1134" y="444" text-anchor="end" class="mono" font-size="11" letter-spacing="1.4" fill="#58798b">BLADEDANCER743 / OPEN SOURCE</text>
</svg>
